[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agroclima-gemelo-digital"
version = "0.1.0"
description = "Backend del gemelo digital agroclimatico: IoT, OpenPLC, MQTT, API y agentes de IA"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Equipo AgroClima" }]
keywords = ["agroclima", "digital-twin", "iot", "esp32", "openplc", "modbus", "mqtt", "fastapi", "langgraph"]

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20",
  "httpx>=0.27,<1.0",
  "orjson>=3.10",
  "SQLAlchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14,<2.0",
  "redis>=5.2,<7.0",
  "paho-mqtt>=2.1,<3.0",
  "structlog>=24.4",
  "tenacity>=9.0",
  "python-json-logger>=3.2",
  "numpy>=2.5.4",
  "pandas>=3.1.1",
  "scipy>=1.18.1",
  "scikit-learn>=1.9.1",
  "joblib>=1.6.0",
]

[project.optional-dependencies]
ai = [
  "langchain>=0.3,<2.0",
  "langchain-core>=0.3,<2.0",
  "langchain-openai>=0.3,<2.0",
  "langchain-community>=0.3,<1.0",
  "langgraph>=0.2,<2.0",
  "openai>=1.60"
]
plc = ["pymodbus>=3.8,<4.0"]
workers = ["celery[redis]>=5.4,<6.0"]
security = ["PyJWT[crypto]>=2.10", "pwdlib[argon2]>=0.2", "cryptography>=44"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.9",
  "mypy>=1.14"
]
all = [
  "langchain>=0.3,<2.0",
  "langchain-core>=0.3,<2.0",
  "langchain-openai>=0.3,<2.0",
  "langchain-community>=0.3,<1.0",
  "langgraph>=0.2,<2.0",
  "openai>=1.60",
  "pymodbus>=3.8,<4.0",
  "celery[redis]>=5.4,<6.0",
  "PyJWT[crypto]>=2.10",
  "pwdlib[argon2]>=0.2",
  "cryptography>=44"
]

[project.scripts]
agroclima-api = "app.main:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = [".venv", "venv", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
