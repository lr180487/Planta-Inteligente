<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Planta Inteligente</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
<style>
:root{--line:#dbe5ef;--text:#0f2237;--muted:#5b7186;--blue:#0284c7;--blue2:#2563eb;--violet:#7c3aed;--red:#e11d48;--green:#059669}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px;color:var(--text);background:radial-gradient(900px 520px at 85% -10%,rgba(2,132,199,.14),transparent 60%),radial-gradient(700px 460px at 0% 100%,rgba(124,58,237,.10),transparent 55%),#f4f7fb}
.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px 32px;box-shadow:0 24px 60px rgba(15,44,74,.12)}
.logo-wrap{position:relative;width:110px;height:110px;margin:0 auto 8px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:4px solid #dbeafe;border-top-color:var(--blue);border-right-color:var(--violet);animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{width:74px;height:74px;border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--blue2) 55%,var(--violet));display:grid;place-items:center;font-size:2rem;color:#fff;box-shadow:0 14px 32px rgba(37,99,235,.32)}
h1{text-align:center;font-size:1.55rem;letter-spacing:-.02em}h1 span{background:linear-gradient(90deg,var(--blue),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);font-size:.93rem;margin:6px 0 24px}
label{font-weight:700;font-size:.88rem;display:block;margin:14px 0 6px}
.field{display:flex;gap:8px}.field input{flex:1}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--text)}input:focus{outline:2px solid #7dd3fc;border-color:#7dd3fc}
.eye{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 14px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:.88rem;color:var(--muted)}.row a{color:var(--blue);text-decoration:none;font-weight:600}
.btn{width:100%;padding:14px;border:none;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 12px 28px rgba(37,99,235,.3);display:flex;align-items:center;justify-content:center;gap:9px}.btn:disabled{opacity:.7;cursor:wait}
.spinner{width:19px;height:19px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;margin:20px 0}.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.guest{width:100%;padding:13px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-weight:700;cursor:pointer;color:var(--text)}
.demo{background:#f0f9ff;border:1px solid #bae6fd;border-radius:13px;padding:13px 14px;font-size:.87rem;color:#0c4a6e;margin-top:20px}.demo b{display:block;margin-bottom:3px}.demo code{background:#e0f2fe;padding:1px 6px;border-radius:6px}
.error{display:none;background:#fff1f2;border:1px solid #fda4af;color:#9f1239;border-radius:12px;padding:11px 13px;font-size:.88rem;margin-top:14px}
.links{text-align:center;margin-top:20px;font-size:.88rem;color:var(--muted)}.links a{color:var(--blue);text-decoration:none;font-weight:600}
.shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
<style id="loader-global">
#loader{position:fixed;inset:0;z-index:999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:opacity .55s ease,visibility .55s,transform .55s ease;font-family:Inter,system-ui,Arial,sans-serif}
#loader.hide{opacity:0;visibility:hidden;transform:scale(.985)}
#loader .ld-wrap{position:relative;width:104px;height:104px;display:grid;place-items:center}
#loader .ld-spin{position:absolute;inset:0;border-radius:50%;border:3px solid #eef2f6;border-top-color:#2563eb;animation:ldSpinG .85s linear infinite;pointer-events:none}
@keyframes ldSpinG{to{transform:rotate(360deg)}}
#loader .ld-logo{width:68px;height:68px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#1d4ed8);display:grid;place-items:center;font-size:1.9rem;color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.35)}
#loader .ld-name{font-weight:700;font-size:1.02rem;color:#17293f;letter-spacing:-.01em;margin-top:2px}
#loader .ld-txt{color:#5b7186;font-size:.9rem;margin-top:-6px}
#loader .ld-bar-row{display:flex;align-items:center;gap:10px;width:min(230px,64vw);margin-top:4px}
#loader .ld-bar{flex:1;height:5px;background:#e2e8f0;border-radius:99px;overflow:hidden}
#loader .ld-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:99px}
#loader .ld-pct{font-weight:700;color:#2563eb;font-size:.88rem;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
@media (prefers-reduced-motion: reduce){#loader .ld-spin{animation-duration:2.2s}}
</style>
</head><body>
<div id="loader" title="Clic para saltar">
  <div class="ld-wrap"><div class="ld-spin" aria-hidden="true"></div><div class="ld-logo">⚙️</div></div>
  <div class="ld-name">Planta Inteligente</div>
  <div class="ld-txt">Cargando el acceso…</div>
  <div class="ld-bar-row"><div class="ld-bar"><i id="loadBar"></i></div><span class="ld-pct" id="loadPct">0%</span></div>
</div>
<main class="card" id="card">
 <a href="landing.html" title="Ir a la Landing" style="display:block;text-decoration:none"><div class="logo-wrap"><div class="ring"></div><div class="logo">⚙️</div></div></a>
 <h1>Planta Inteligente</h1>
 <p class="sub">Accede a la plataforma IoT industrial inteligente</p>

 <form id="form" novalidate>
 <label for="email">Correo electrónico</label>
 <input type="email" id="email" placeholder="admin@example.com" autocomplete="username" value="admin@example.com">
 <label for="pass">Contraseña</label>
 <div class="field"><input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" value="1234"><button type="button" class="eye" id="eye" title="Mostrar / ocultar">👁</button></div>
 <div class="row"><label style="margin:0;font-weight:600;display:flex;gap:7px;align-items:center"><input type="checkbox" id="remember" checked style="width:auto"> Recuérdame</label><a href="#" id="forgot">¿Olvidaste tu contraseña?</a></div>
 <div class="error" id="error"></div>
 <button class="btn primary" id="submit"><span class="spinner" id="spinner"></span><span id="submitText">Iniciar sesión →</span></button>
 </form>

 <div class="divider">o</div>
 <button class="guest" id="guest">👀 Ingresar como invitado (ver Dashboard)</button>

 <div class="demo"><b>🔑 Credenciales de demostración</b>Correo: <code>admin@example.com</code><br>Contraseña: <code>1234</code></div>
 
</main>

<script>
const $=id=>document.getElementById(id);
$('eye').onclick=()=>{pass.type=pass.type==='password'?'text':'password'};
$('forgot').onclick=e=>{e.preventDefault();alert('Demo: usa admin@example.com / 1234 o ingresa como invitado.')};
function doLogin(user,role){
 submit.disabled=true;spinner.style.display='block';submitText.textContent='Verificando credenciales…';error.style.display='none';
 setTimeout(()=>{
 localStorage.setItem('iot_session',JSON.stringify({user,role,loginAt:new Date().toISOString(),remember:remember.checked}));
 submitText.textContent='✅ Acceso concedido · Redirigiendo…';
 setTimeout(()=>location.href='dashboard.html',600);
 },900);
}
$('form').addEventListener('submit',e=>{
 e.preventDefault();
 const em=$('email').value.trim(),pw=$('pass').value;
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){showError('Ingresa un correo válido.');return}
 if(em==='admin@example.com'&&pw==='1234')doLogin(em,'Administrador');
 else showError('Credenciales incorrectas. Usa la cuenta de demostración indicada abajo, o ingresa como invitado.');
});
function showError(msg){const err=$('error'),cd=$('card');err.textContent='⚠ '+msg;err.style.display='block';cd.classList.remove('shake');void cd.offsetWidth;cd.classList.add('shake')}
$('guest').onclick=()=>doLogin('invitado@demo.local','Invitado (solo lectura)');
if(new URLSearchParams(location.search).get('logout')){localStorage.removeItem('iot_session')}
</script>

<style>
.ck-bar{position:fixed;left:16px;right:16px;bottom:16px;z-index:300;max-width:560px;margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 16px 44px rgba(15,23,42,.14);padding:18px;font-family:Inter,system-ui,Arial,sans-serif;color:#111827;transform:translateY(16px);opacity:0;visibility:hidden;transition:.35s}
.ck-bar.show{transform:none;opacity:1;visibility:visible}
.ck-bar b{font-size:.98rem}.ck-bar p{color:#6b7280;font-size:.86rem;margin:5px 0 12px;line-height:1.5}
.ck-bar a{color:#111827;font-weight:700}
.ck-btns{display:flex;gap:8px;flex-wrap:wrap}
.ck-btn{flex:1;min-width:130px;padding:11px 12px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;font:inherit;font-weight:700;cursor:pointer;font-size:.88rem}
.ck-btn.main{background:#111827;color:#fff;border-color:#111827}
.ck-cfg{display:none;border-top:1px solid #eee;margin-top:13px;padding-top:11px}
.ck-cfg.open{display:block}
.ck-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:.88rem}
.ck-row small{display:block;color:#9ca3af}
.ck-sw{width:44px;height:25px;border-radius:99px;background:#d1d5db;border:none;cursor:pointer;position:relative;flex:none}
.ck-sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.18s}
.ck-sw.on{background:#111827}.ck-sw.on::after{left:22px}
.ck-sw:disabled{opacity:.55;cursor:not-allowed}
.ck-links{border-top:1px solid #eee;margin-top:22px;padding:14px 0 2px;font-size:.84rem;color:#6b7280;display:flex;gap:14px;flex-wrap:wrap}
.ck-links a{color:#374151;font-weight:600;text-decoration:none}.ck-links a:hover{text-decoration:underline}
</style>
<script>
(function(){
  // Enlaces legales al final de la página
  try{
    var f=document.querySelector('footer');
    if(f && !f.querySelector('.ck-links')){
      var d=document.createElement('div'); d.className='ck-links';
      d.innerHTML='<a href="privacidad.html">Privacidad</a><a href="terminos.html">Términos y Condiciones</a><a href="cookies.html">Cookies</a><a href="#" id="ckReopen">Configurar cookies</a>';
      (f.querySelector('.wrap')||f).appendChild(d);
    }
  }catch(e){}
  var KEY='iot_consent';
  function get(){ try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;} }
  function set(v){ try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){} }
  function build(){
    if(document.getElementById('ckBar'))return;
    var bar=document.createElement('div'); bar.className='ck-bar'; bar.id='ckBar'; bar.setAttribute('role','dialog'); bar.setAttribute('aria-label','Aviso de cookies');
    bar.innerHTML='<b>🍪 Tu privacidad</b><p>Guardamos datos en tu navegador para recordar tu sesión y preferencias. Puedes aceptar todo, rechazar lo opcional o configurarlo. Más detalle en la <a href="cookies.html">Política de Cookies</a> y la <a href="privacidad.html">Política de Privacidad</a>.</p>'
      +'<div class="ck-btns"><button class="ck-btn main" id="ckAll">Aceptar todo</button><button class="ck-btn" id="ckReject">Rechazar opcionales</button><button class="ck-btn" id="ckCfgBtn">Configurar</button></div>'
      +'<div class="ck-cfg" id="ckCfg">'
      +'<div class="ck-row"><span><b>Necesarias</b><small>Sesión y tu decisión de consentimiento</small></span><button class="ck-sw on" disabled aria-label="Necesarias siempre activas"></button></div>'
      +'<div class="ck-row"><span><b>Preferencias</b><small>Perfil, sonidos, favoritos y recientes</small></span><button class="ck-sw on" id="ckPref" aria-label="Preferencias"></button></div>'
      +'<div class="ck-row"><span><b>Analítica</b><small>Estadísticas de uso de la demo</small></span><button class="ck-sw" id="ckAna" aria-label="Analítica"></button></div>'
      +'<div class="ck-btns" style="margin-top:10px"><button class="ck-btn main" id="ckSave">Guardar mi elección</button></div></div>';
    document.body.appendChild(bar);
    requestAnimationFrame(function(){ setTimeout(function(){ bar.classList.add('show'); },350); });
    function close(v){ set(v); bar.classList.remove('show'); setTimeout(function(){ if(bar.parentNode)bar.parentNode.removeChild(bar); },380); }
    bar.querySelector('#ckAll').onclick=function(){ close({necessary:true,preferences:true,analytics:true,ts:Date.now()}); };
    bar.querySelector('#ckReject').onclick=function(){ close({necessary:true,preferences:false,analytics:false,ts:Date.now()}); };
    bar.querySelector('#ckCfgBtn').onclick=function(){ bar.querySelector('#ckCfg').classList.toggle('open'); };
    bar.querySelectorAll('#ckPref,#ckAna').forEach(function(b){ b.onclick=function(){ b.classList.toggle('on'); }; });
    bar.querySelector('#ckSave').onclick=function(){ close({necessary:true,preferences:bar.querySelector('#ckPref').classList.contains('on'),analytics:bar.querySelector('#ckAna').classList.contains('on'),ts:Date.now()}); };
  }
  document.addEventListener('click',function(e){ if(e.target && e.target.id==='ckReopen'){ e.preventDefault(); try{localStorage.removeItem(KEY);}catch(err){} build(); } });
  if(!get()) build();
})();
</script>

<script id="loader-global-js">
(function(){
  var loader=document.getElementById('loader'); if(!loader)return;
  var bar=document.getElementById('loadBar'), pct=document.getElementById('loadPct');
  var t0=Date.now(), D=1800, done=false, last=-1;
  function finish(){ if(done)return; done=true; loader.classList.add('hide'); setTimeout(function(){ if(loader.parentNode)loader.parentNode.removeChild(loader); },380); }
  loader.addEventListener('click',finish);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')finish(); });
  (function tick(){
    if(done)return;
    var raw=Math.min((Date.now()-t0)/D,1), eased=1-Math.pow(1-raw,2);
    var v=Math.floor(eased*100); if(v!==last){last=v; pct.textContent=v+'%';} bar.style.transform='scaleX('+eased+')';
    if(raw<1) requestAnimationFrame(tick); else { pct.textContent='100%'; bar.style.transform='scaleX(1)'; setTimeout(finish,120); }
  })();
})();
</script>
